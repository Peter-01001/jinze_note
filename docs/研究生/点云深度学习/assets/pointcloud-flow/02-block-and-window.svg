<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880">
<rect width="1600" height="880" fill="#F7FAFC"/>
<text x="60" y="67" text-anchor="start" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="42" fill="#263B50">60 米切块与 8 米采样窗口，是两种操作</text>
<text x="60" y="117" text-anchor="start" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="25" fill="#263B50">大块用于保存和标注；小窗口用于临时组织模型输入。</text>
<rect x="90" y="195" width="460" height="460" rx="4" fill="#EEF5FC" stroke="#3273AD" stroke-width="2"/>
<polyline points="136.0,195 136.0,655" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="90,241.0 550,241.0" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="182.0,195 182.0,655" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="90,287.0 550,287.0" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="228.0,195 228.0,655" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="90,333.0 550,333.0" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="274.0,195 274.0,655" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="90,379.0 550,379.0" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="320.0,195 320.0,655" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="90,425.0 550,425.0" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="366.0,195 366.0,655" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="90,471.0 550,471.0" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="412.0,195 412.0,655" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="90,517.0 550,517.0" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="458.0,195 458.0,655" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="90,563.0 550,563.0" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="504.0,195 504.0,655" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<polyline points="90,609.0 550,609.0" fill="none" stroke="#D3E2EF" stroke-width="1"/>
<text x="320.0" y="178" text-anchor="middle" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="25" fill="#263B50">磁盘中的一个 60 × 60 米 LAS 块</text>
<rect x="310" y="395" width="61.333333333333336" height="61.333333333333336" rx="2" fill="#88D6B1" stroke="#238269" stroke-width="2"/>
<text x="380" y="448" text-anchor="start" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="23" fill="#238269">8 × 8 米窗口</text>
<polyline points="340,425 720,420" fill="none" stroke="#238269" stroke-width="3"/>
<polygon points="720,420 707.4749499822752,426.254847884121 707.3147133926351,414.0768670714723" fill="#238269"/>
<rect x="740" y="330" width="750" height="110" rx="16" fill="#EAF7F0" stroke="#238269" stroke-width="2"/>
<text x="1115.0" y="370" text-anchor="middle" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="27" fill="#238269">Dataset / 预测程序：选窗口并抽点</text>
<text x="1115.0" y="403" text-anchor="middle" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#466175">默认抽 4,096 点，点不够时可重复抽取</text>
<polyline points="1115,440 1115,495" fill="none" stroke="#238269" stroke-width="3"/>
<polygon points="1115,495 1108.9104825224429,482.39374056706254 1121.0895174775571,482.39374056706254" fill="#238269"/>
<rect x="740" y="500" width="750" height="110" rx="16" fill="#EAF7F0" stroke="#238269" stroke-width="2"/>
<text x="1115.0" y="540" text-anchor="middle" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="27" fill="#238269">每点 9 维模型输入</text>
<text x="1115.0" y="573" text-anchor="middle" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#466175">中心化 XYZ + RGB / 255 + 归一化 XYZ</text>
<text x="95" y="717" text-anchor="start" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="27" fill="#22629E">切块步骤：写出小 LAS 文件</text>
<text x="95" y="759" text-anchor="start" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="24" fill="#263B50">人工操作：在这些小块中分开各类别</text>
<text x="740" y="685" text-anchor="start" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="25" fill="#238269">采样步骤：在内存中生成样本，不另存 8 米文件</text>
<text x="740" y="734" text-anchor="start" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="24" fill="#263B50">训练窗口：随机选位置；预测窗口：按步长滑动</text>
<text x="60" y="836" text-anchor="start" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="21" fill="#263B50">示意图以坐标单位为米为前提；每个窗口保留其中所有高度的点。</text>
</svg>